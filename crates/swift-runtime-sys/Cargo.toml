[package]
name = "swift-runtime-sys"
description = "Raw FFI bindings to the Swift Runtime"
version = "0.0.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/eugenehp/swift-runtime-sys"
keywords = ["swift", "runtime", "sys", "bindings", "ffi"]
readme = "../../README.md"
exclude = ["swift"]

[lib]
name = "swift_runtime_sys"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[build-dependencies]
bindgen = { package = "bindgen", git = "https://github.com/eugenehp/rust-bindgen.git", branch = "swift", version = "0.69.4" }
