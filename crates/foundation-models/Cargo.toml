[package]
name = "foundation-models"
description = "Apple Intelligence on-device LLM from Rust"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "foundation_models"

[dependencies]
apple-sys-helpers = { workspace = true }
libc = "0.2"
tokio = { version = "1", features = ["rt"], optional = true }

[features]
default = []
async = ["tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
