name: Runtime Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  parity:
    name: Parity matrix (${{ matrix.runner }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
        profile: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.runner }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.runner }}-cargo-

      - name: Verify Swift version
        run: swift --version

      - name: Install tmux (required by run_parity_matrix.sh)
        run: brew install tmux

      - name: Build runtime thunks
        run: ./scripts/build_runtime_thunks.sh

      - name: Run parity matrix
        run: PROFILE=${{ matrix.profile }} ./scripts/run_parity_matrix.sh

      - name: Write support cell manifest (parity)
        run: ./scripts/write_support_cell_manifest.sh parity ${{ matrix.runner }} ${{ matrix.profile }} target/runtime-probe/support-cell-manifest.json

      - name: Print parity report
        if: always()
        run: cat target/runtime-probe/parity-report.md || true

      - name: Show parity trend (last 2 history entries)
        if: always()
        run: |
          HIST_DIR="target/runtime-probe/history"
          if [[ -d "$HIST_DIR" ]]; then
            mapfile -t history_files < <(ls -t "$HIST_DIR"/*.json 2>/dev/null | head -2)
            if [[ ${#history_files[@]} -ge 2 ]]; then
              prev="${history_files[1]}"
              curr="${history_files[0]}"
              prev_pass=$(python3 -c "import json,sys; d=json.load(open('$prev')); print(d.get('pass_count',0))")
              curr_pass=$(python3 -c "import json,sys; d=json.load(open('$curr')); print(d.get('pass_count',0))")
              total=$(python3 -c "import json,sys; d=json.load(open('$curr')); print(d.get('total_checks',0))")
              delta=$((curr_pass - prev_pass))
              if [[ $delta -gt 0 ]]; then trend="+${delta}"; elif [[ $delta -lt 0 ]]; then trend="${delta}"; else trend="no change"; fi
              echo "Parity trend: ${trend} (prev=${prev_pass}/${total}, now=${curr_pass}/${total})"
            elif [[ ${#history_files[@]} -eq 1 ]]; then
              curr="${history_files[0]}"
              curr_pass=$(python3 -c "import json,sys; d=json.load(open('$curr')); print(d.get('pass_count',0))")
              total=$(python3 -c "import json,sys; d=json.load(open('$curr')); print(d.get('total_checks',0))")
              echo "Parity trend: first run — ${curr_pass}/${total} pass"
            else
              echo "Parity trend: no history files yet"
            fi
          else
            echo "Parity trend: no history directory"
          fi

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ matrix.runner }}-${{ matrix.profile }}-${{ github.sha }}
          path: |
            target/runtime-probe/parity-report.json
            target/runtime-probe/parity-report.md
            target/runtime-probe/support-cell-manifest.json
            target/runtime-probe/probe.log
            target/runtime-probe/history/

  stress:
    name: Parity stress gate (macOS arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install tmux
        run: brew install tmux

      - name: Build runtime thunks
        run: ./scripts/build_runtime_thunks.sh

      - name: Run stress gate
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FUZZ_CASES=64 ./scripts/run_parity_stress.sh 3
          else
            FUZZ_CASES=128 ./scripts/run_parity_stress.sh 10
          fi
        env:
          STOP_ON_FAIL: "1"

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-${{ github.sha }}
          path: target/runtime-probe/stress/

  protocol_dispatch:
    name: Protocol dispatch matrix (macOS arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-protocol-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-protocol-

      - name: Run protocol dispatch matrix
        run: ./scripts/run_protocol_dispatch_matrix.sh

      - name: Upload protocol dispatch artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-dispatch-${{ github.sha }}
          path: target/runtime-probe/protocol-dispatch-matrix.md

  abi_shape_closure:
    name: ABI shape closure (macOS arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-abi-shapes-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-abi-shapes-

      - name: Run ABI shape closure gate
        run: ./scripts/run_abi_shape_closure.sh

      - name: Upload ABI shape artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abi-shape-closure-${{ github.sha }}
          path: |
            target/runtime-probe/abi-shape-closure.json
            target/runtime-probe/abi-shape-closure.md
            target/runtime-probe/abi-shape-results/

  differential_oracle:
    name: Differential oracle gate (macOS arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-differential-oracle-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-differential-oracle-

      - name: Run AP.4 differential oracle gate
        run: ./scripts/run_ap4_differential_oracle.sh

      - name: Upload differential oracle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-oracle-${{ github.sha }}
          path: |
            target/runtime-probe/ap4-differential-oracle.md
            target/runtime-probe/ap4-differential-campaign/

  reliability_soak:
    name: Reliability soak gate (macOS arm64)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-reliability-soak-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-reliability-soak-

      - name: Run AP.5 reliability soak gate
        env:
          AP5_SOAK_RUNS: ${{ github.event_name == 'pull_request' && '3' || '5' }}
          AP5_HISTORY_WINDOW: '5'
          AP5_FLAKE_BUDGET: '0'
        run: ./scripts/run_ap5_reliability_soak.sh

      - name: Upload reliability soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-soak-${{ github.sha }}
          path: |
            target/runtime-probe/ap5-soak/

  contract_parity:
    name: Contract parity (${{ matrix.runner }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
        profile: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.runner }}-cargo-contract-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.runner }}-cargo-

      - name: Build and run contract parity probes
        run: PROFILE=${{ matrix.profile }} ./scripts/run_contract_parity.sh

      - name: Write support cell manifest (contract)
        run: ./scripts/write_support_cell_manifest.sh contract ${{ matrix.runner }} ${{ matrix.profile }} target/runtime-probe/support-cell-manifest.json

      - name: Upload contract parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-parity-${{ matrix.runner }}-${{ matrix.profile }}-${{ github.sha }}
          path: |
            target/runtime-probe/contract-parity.md
            target/runtime-probe/contract-descriptor.log
            target/runtime-probe/contract-dispatch.log
            target/runtime-probe/support-cell-manifest.json

  support_matrix_signoff:
    name: Support matrix signoff
    runs-on: macos-15
    needs: [parity, stress, protocol_dispatch, abi_shape_closure, differential_oracle, reliability_soak, contract_parity, multiversion_compat]

    steps:
      - uses: actions/checkout@v4

      - name: Download parity artifacts from all cells
        uses: actions/download-artifact@v4
        with:
          pattern: parity-report-*
          path: target/ci/parity-artifacts
          merge-multiple: false

      - name: Download contract artifacts from all cells
        uses: actions/download-artifact@v4
        with:
          pattern: contract-parity-*
          path: target/ci/parity-artifacts
          merge-multiple: false

      - name: Validate support matrix parity artifacts
        run: MATRIX_CONTRACT=scripts/support_matrix_contract.json ./scripts/validate_support_matrix_artifacts.sh target/ci/parity-artifacts

      - name: Validate promotion policy (PR)
        if: github.event_name == 'pull_request'
        env:
          PROMOTION_HISTORY_WINDOW: "1"
        run: ./scripts/validate_promotion_policy.sh target/ci/parity-artifacts

      - name: Validate promotion policy (main)
        if: github.event_name != 'pull_request'
        env:
          PROMOTION_HISTORY_WINDOW: "1"
        run: ./scripts/validate_promotion_policy.sh target/ci/parity-artifacts

      - name: Validate plan completion
        run: ./scripts/validate_plan_completion.sh

      - name: Capture reproducibility inputs
        run: ./scripts/capture_repro_inputs.sh

      - name: Validate parity claim contract
        run: ./scripts/validate_parity_claim_contract.sh

      - name: Upload support matrix signoff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-matrix-signoff-${{ github.sha }}
          path: |
            target/runtime-probe/support-matrix-signoff.md
            target/runtime-probe/promotion-policy-signoff.md
            target/runtime-probe/plan-completion-signoff.md
            target/runtime-probe/abi-shape-closure.md
            target/runtime-probe/abi-shape-closure.json
            target/runtime-probe/ap4-differential-oracle.md
            target/runtime-probe/ap5-soak/ap5-soak-summary.md
            target/runtime-probe/ap5-soak/ap5-soak-summary.json
            target/runtime-probe/ap5-soak/ap5-stability-trend.md
            target/runtime-probe/repro-inputs.json
            target/runtime-probe/parity-claim-signoff.md

  upstream_conformance:
    name: Upstream conformance (${{ matrix.upstream_ref }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        upstream_ref: [swift-6.2.4-RELEASE, main]

  multiversion_compat:
    name: Multi-version compatibility (${{ matrix.runner }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
        profile: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.runner }}-cargo-multiversion-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.runner }}-cargo-

      - name: Install tmux
        run: brew install tmux

      - name: Build runtime thunks
        run: ./scripts/build_runtime_thunks.sh

      - name: Verify Swift version
        run: swift --version

      - name: Run B.5 multi-version compatibility gate
        run: PROFILE=${{ matrix.profile }} ./scripts/run_multiversion_compat.sh

      - name: Upload multi-version artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multiversion-compat-${{ matrix.runner }}-${{ matrix.profile }}-${{ github.sha }}
          path: |
            target/runtime-probe/multiversion-compat-matrix.json
            target/runtime-probe/multiversion-compat-matrix.md


    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-upstream-${{ matrix.upstream_ref }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-upstream-

      - name: Run upstream conformance
        run: ./scripts/run_upstream_conformance.sh ${{ matrix.upstream_ref }}

      - name: Upload upstream conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-conformance-${{ matrix.upstream_ref }}-${{ github.sha }}
          path: |
            target/runtime-probe/upstream-conformance/current/${{ matrix.upstream_ref }}.json
            target/runtime-probe/upstream-conformance/current/${{ matrix.upstream_ref }}.md
            target/runtime-probe/upstream-conformance/history/

      - name: Auto-open regression issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `AP.7 upstream conformance regression: ${context.runId} (${process.env.UPSTREAM_REF})`;
            const body = [
              'Automated upstream conformance regression record.',
              '',
              `- upstream_ref: ${process.env.UPSTREAM_REF}`,
              `- workflow_run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- sha: ${context.sha}`,
              '',
              'Failure occurred in scheduled/workflow-dispatch upstream conformance gate.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['regression', 'upstream-conformance']
            });
        env:
          UPSTREAM_REF: ${{ matrix.upstream_ref }}

  upstream_promotion_policy:
    name: Upstream promotion policy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    needs: [upstream_conformance]

    steps:
      - uses: actions/checkout@v4

      - name: Download upstream conformance artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: upstream-conformance-*
          path: target/ci/upstream-artifacts
          merge-multiple: false

      - name: Validate upstream release promotion policy
        run: ./scripts/validate_upstream_promotion_policy.sh target/ci/upstream-artifacts

      - name: Upload upstream promotion signoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-promotion-signoff-${{ github.sha }}
          path: target/runtime-probe/upstream-promotion-signoff.md
