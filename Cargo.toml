[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = [
    'cfg(target_os, values("xros", "tvos", "watchos"))',
    'cfg(target_abi, values("sim"))',
] }

[workspace.dependencies]
apple-sys-helpers = { path = "crates/apple-sys-helpers" }

